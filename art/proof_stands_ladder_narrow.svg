<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 858" width="360" height="858" role="img" aria-label="A ladder of 15 statements: six equivalent to the Riemann Hypothesis, six proved on it or on its Dirichlet form, and three still open even if the proof stands"><rect width="360" height="858" fill="#fbf9f4"/><line x1="8" x2="8" y1="34" y2="850" stroke="#8a4b16" stroke-width="3"/><line x1="352" x2="352" y1="34" y2="850" stroke="#8a4b16" stroke-width="3"/><text x="180.0" y="26" font-size="17" text-anchor="middle" fill="#1d1b18" font-family="Georgia, serif">If the proof stands</text><text x="20" y="56" font-size="12" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">These are the Riemann Hypothesis</text><rect x="14" y="64" width="332" height="40" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="22" y="80" font-size="12.5" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Robin</text><text x="338" y="80" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">26 exceptions, all ≤ 5040</text><text x="22" y="97" font-size="12" fill="#1d1b18" font-family="Georgia, serif">σ(n) &lt; e<tspan baseline-shift="super" font-size="72%">γ</tspan>·n·log log n past 5040</text><rect x="14" y="110" width="332" height="40" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="22" y="126" font-size="12.5" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Nicolas</text><text x="338" y="126" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">5,761,455 checked</text><text x="22" y="143" font-size="12" fill="#1d1b18" font-family="Georgia, serif">N/φ(N) &gt; e<tspan baseline-shift="super" font-size="72%">γ</tspan>·log log N, N = 2·3·5···p</text><rect x="14" y="156" width="332" height="40" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="22" y="172" font-size="12.5" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Lagarias</text><text x="338" y="172" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">tightest at n = 12</text><text x="22" y="189" font-size="12" fill="#1d1b18" font-family="Georgia, serif">σ(n) ≤ H(n) + exp(H(n))·log H(n)</text><rect x="14" y="202" width="332" height="40" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="22" y="218" font-size="12.5" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Franel, Landau</text><text x="338" y="218" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">fractions off the grid</text><text x="22" y="235" font-size="12" fill="#1d1b18" font-family="Georgia, serif">absolute Farey offsets sum to O(N<tspan baseline-shift="super" font-size="72%">1/2+ε</tspan>)</text><rect x="14" y="248" width="332" height="40" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="22" y="264" font-size="12.5" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Li</text><text x="338" y="264" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">50 zero pairs: 80.283% of λ₁</text><text x="22" y="281" font-size="12" fill="#1d1b18" font-family="Georgia, serif">every Li number λₙ is ≥ 0</text><rect x="14" y="294" width="332" height="40" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="22" y="310" font-size="12.5" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">de Bruijn, Newman</text><text x="338" y="310" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">no room to spare</text><text x="22" y="327" font-size="12" fill="#1d1b18" font-family="Georgia, serif">Λ = 0, no room to spare</text><text x="20" y="362" font-size="12" fill="#2b5c8a" font-family="Georgia, serif" font-weight="bold">Proved long ago, on it</text><rect x="14" y="370" width="332" height="40" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.4"/><text x="22" y="386" font-size="12.5" fill="#2b5c8a" font-family="Georgia, serif" font-weight="bold">Schoenfeld</text><text x="338" y="386" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">from x = 2657</text><text x="22" y="403" font-size="12" fill="#1d1b18" font-family="Georgia, serif">|π(x) − li(x)| &lt; √x·log x/(8π)</text><rect x="14" y="416" width="332" height="40" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.4"/><text x="22" y="432" font-size="12.5" fill="#2b5c8a" font-family="Georgia, serif" font-weight="bold">Carneiro et al.</text><text x="338" y="432" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">below 10<tspan baseline-shift="super" font-size="72%">10</tspan>, closest 88.3% at 7</text><text x="22" y="449" font-size="12" fill="#1d1b18" font-family="Georgia, serif">next prime within (22/25)·√p·log p</text><text x="20" y="484" font-size="12" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">On the Dirichlet form of it</text><rect x="14" y="492" width="332" height="40" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="22" y="508" font-size="12.5" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Littlewood</text><text x="338" y="508" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">1,215,854 fields drawn</text><text x="22" y="525" font-size="12" fill="#1d1b18" font-family="Georgia, serif">L(1, χ) in a log log band</text><rect x="14" y="538" width="332" height="40" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="22" y="554" font-size="12.5" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Weinberger, Kani</text><text x="338" y="554" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">the largest is 1848</text><text x="22" y="571" font-size="12" fill="#1d1b18" font-family="Georgia, serif">Euler’s list is exactly 65 numbers</text><rect x="14" y="584" width="332" height="40" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="22" y="600" font-size="12.5" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Miller, Bach</text><text x="338" y="600" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">a test becomes a proof</text><text x="22" y="617" font-size="12" fill="#1d1b18" font-family="Georgia, serif">witnesses to 2·(ln n)² decide primality</text><rect x="14" y="630" width="332" height="40" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="22" y="646" font-size="12.5" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Lamzouri et al.</text><text x="338" y="646" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">every prime p ≥ 5</text><text x="22" y="663" font-size="12" fill="#1d1b18" font-family="Georgia, serif">least non-square mod p below (ln p)²</text><text x="20" y="698" font-size="12" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Still open, even if it stands</text><rect x="14" y="706" width="332" height="40" rx="5" fill="#fbf9f4" stroke="#a3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="22" y="722" font-size="12.5" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Legendre</text><text x="338" y="722" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">RH’s gap bound too weak from x = 14 on</text><text x="22" y="739" font-size="12" fill="#1d1b18" font-family="Georgia, serif">a prime between consecutive squares</text><rect x="14" y="752" width="332" height="40" rx="5" fill="#fbf9f4" stroke="#a3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="22" y="768" font-size="12.5" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Cramér</text><text x="338" y="768" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">records to 10<tspan baseline-shift="super" font-size="72%">10</tspan>: 0.72·(log p)²</text><text x="22" y="785" font-size="12" fill="#1d1b18" font-family="Georgia, serif">gaps never much above (log p)²</text><rect x="14" y="798" width="332" height="40" rx="5" fill="#fbf9f4" stroke="#a3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="22" y="814" font-size="12.5" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Simple zeros</text><text x="338" y="814" font-size="11" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">≥ 67% of the count, far enough up</text><text x="22" y="831" font-size="12" fill="#1d1b18" font-family="Georgia, serif">every zero of zeta is single</text></svg>
