<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 622" width="880" height="622" role="img" aria-label="A ladder of 15 statements: six equivalent to the Riemann Hypothesis, six proved on it or on its Dirichlet form, and three still open even if the proof stands"><rect width="880" height="622" fill="#fbf9f4"/><line x1="28" x2="28" y1="38" y2="614" stroke="#8a4b16" stroke-width="3"/><line x1="852" x2="852" y1="38" y2="614" stroke="#8a4b16" stroke-width="3"/><text x="440.0" y="26" font-size="19" text-anchor="middle" fill="#1d1b18" font-family="Georgia, serif">If the proof stands: what becomes true, and what does not</text><text x="40" y="60" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">These are the Riemann Hypothesis</text><text x="840" y="60" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif" font-style="italic">each is true exactly when every zero is on the line</text><rect x="34" y="68" width="812" height="24" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="44" y="84" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Robin</text><text x="184" y="84" font-size="13" fill="#1d1b18" font-family="Georgia, serif">σ(n) &lt; e<tspan baseline-shift="super" font-size="72%">γ</tspan>·n·log log n for every n &gt; 5040</text><text x="836" y="84" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">26 exceptions, all ≤ 5040</text><rect x="34" y="98" width="812" height="24" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="44" y="114" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Nicolas</text><text x="184" y="114" font-size="13" fill="#1d1b18" font-family="Georgia, serif">N/φ(N) &gt; e<tspan baseline-shift="super" font-size="72%">γ</tspan>·log log N for every primorial N</text><text x="836" y="114" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">5,761,455 checked</text><rect x="34" y="128" width="812" height="24" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="44" y="144" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Lagarias</text><text x="184" y="144" font-size="13" fill="#1d1b18" font-family="Georgia, serif">σ(n) ≤ H(n) + exp(H(n))·log H(n) for every n</text><text x="836" y="144" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">tightest at n = 12</text><rect x="34" y="158" width="812" height="24" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="44" y="174" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Franel, Landau</text><text x="184" y="174" font-size="13" fill="#1d1b18" font-family="Georgia, serif">the absolute Farey offsets add up to O(N<tspan baseline-shift="super" font-size="72%">1/2+ε</tspan>)</text><text x="836" y="174" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">fractions off the grid</text><rect x="34" y="188" width="812" height="24" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="44" y="204" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">Li</text><text x="184" y="204" font-size="13" fill="#1d1b18" font-family="Georgia, serif">every one of Li’s numbers λₙ is ≥ 0</text><text x="836" y="204" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">50 zero pairs: 80.283% of λ₁</text><rect x="34" y="218" width="812" height="24" rx="5" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.4"/><text x="44" y="234" font-size="13" fill="#2f6f4f" font-family="Georgia, serif" font-weight="bold">de Bruijn, Newman</text><text x="184" y="234" font-size="13" fill="#1d1b18" font-family="Georgia, serif">Λ ≤ 0; with Rodgers and Tao’s Λ ≥ 0, Λ = 0</text><text x="836" y="234" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">no room to spare</text><text x="40" y="270" font-size="13" fill="#2b5c8a" font-family="Georgia, serif" font-weight="bold">Proved long ago, on the Riemann Hypothesis</text><text x="840" y="270" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif" font-style="italic">waiting for it</text><rect x="34" y="278" width="812" height="24" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.4"/><text x="44" y="294" font-size="13" fill="#2b5c8a" font-family="Georgia, serif" font-weight="bold">Schoenfeld</text><text x="184" y="294" font-size="13" fill="#1d1b18" font-family="Georgia, serif">|π(x) − li(x)| &lt; √x·log x/(8π) for every x ≥ 2657</text><text x="836" y="294" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">from x = 2657</text><rect x="34" y="308" width="812" height="24" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.4"/><text x="44" y="324" font-size="13" fill="#2b5c8a" font-family="Georgia, serif" font-weight="bold">Carneiro et al.</text><text x="184" y="324" font-size="13" fill="#1d1b18" font-family="Georgia, serif">after each prime p &gt; 3, a prime within (22/25)·√p·log p</text><text x="836" y="324" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">below 10<tspan baseline-shift="super" font-size="72%">10</tspan>, closest 88.3% at 7</text><text x="40" y="360" font-size="13" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Proved on the same hypothesis for Dirichlet L-functions</text><text x="840" y="360" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif" font-style="italic">the release’s other final theorems</text><rect x="34" y="368" width="812" height="24" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="44" y="384" font-size="13" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Littlewood</text><text x="184" y="384" font-size="13" fill="#1d1b18" font-family="Georgia, serif">L(1, χ) of a quadratic field stays in a log log band</text><text x="836" y="384" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">1,215,854 fields drawn</text><rect x="34" y="398" width="812" height="24" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="44" y="414" font-size="13" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Weinberger, Kani</text><text x="184" y="414" font-size="13" fill="#1d1b18" font-family="Georgia, serif">Euler’s convenient numbers are exactly 65</text><text x="836" y="414" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">the largest is 1848</text><rect x="34" y="428" width="812" height="24" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="44" y="444" font-size="13" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Miller, Bach</text><text x="184" y="444" font-size="13" fill="#1d1b18" font-family="Georgia, serif">witnesses up to 2·(ln n)² decide whether n is prime</text><text x="836" y="444" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">a test becomes a proof</text><rect x="34" y="458" width="812" height="24" rx="5" fill="#ffffff" stroke="#5a4b9a" stroke-width="1.4"/><text x="44" y="474" font-size="13" fill="#5a4b9a" font-family="Georgia, serif" font-weight="bold">Lamzouri et al.</text><text x="184" y="474" font-size="13" fill="#1d1b18" font-family="Georgia, serif">the least positive non-square mod p is below (ln p)²</text><text x="836" y="474" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">every prime p ≥ 5</text><text x="40" y="510" font-size="13" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Still open, even if the proof stands</text><text x="840" y="510" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif" font-style="italic">what the hypothesis does not reach</text><rect x="34" y="518" width="812" height="24" rx="5" fill="#fbf9f4" stroke="#a3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="44" y="534" font-size="13" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Legendre</text><text x="184" y="534" font-size="13" fill="#1d1b18" font-family="Georgia, serif">a prime between any two consecutive squares</text><text x="836" y="534" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">RH’s gap bound too weak from x = 14 on</text><rect x="34" y="548" width="812" height="24" rx="5" fill="#fbf9f4" stroke="#a3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="44" y="564" font-size="13" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Cramér</text><text x="184" y="564" font-size="13" fill="#1d1b18" font-family="Georgia, serif">gaps between primes never much above (log p)²</text><text x="836" y="564" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">records to 10<tspan baseline-shift="super" font-size="72%">10</tspan>: 0.72·(log p)²</text><rect x="34" y="578" width="812" height="24" rx="5" fill="#fbf9f4" stroke="#a3261e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="44" y="594" font-size="13" fill="#a3261e" font-family="Georgia, serif" font-weight="bold">Simple zeros</text><text x="184" y="594" font-size="13" fill="#1d1b18" font-family="Georgia, serif">every zero of zeta is a single zero</text><text x="836" y="594" font-size="12" fill="#6b645a" text-anchor="end" font-family="Georgia, serif">≥ 67% of the count, far enough up</text></svg>
