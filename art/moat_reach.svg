 207.7L669.4 213.7" fill="none" stroke="#c0652a" stroke-width="1.2"/><path d="M659.9 234.2L671.9 234.2L665.9 223.7Z" fill="#fbf9f4" stroke="#c0652a" stroke-width="1.4"/><line x1="665.9" x2="665.9" y1="186.3" y2="172.3" stroke="#c0652a" stroke-width="1.2"/><path d="M662.4 176.3L665.9 170.3L669.4 176.3" fill="none" stroke="#c0652a" stroke-width="1.2"/><path d="M659.9 196.8L671.9 196.8L665.9 186.3Z" fill="#fbf9f4" stroke="#c0652a" stroke-width="1.4"/><line x1="665.9" x2="665.9" y1="158.0" y2="144.0" stroke="#c0652a" stroke-width="1.2"/><path d="M662.4 148.0L665.9 142.0L669.4 148.0" fill="none" stroke="#c0652a" stroke-width="1.2"/><path d="M659.9 168.5L671.9 168.5L665.9 158.0Z" fill="#fbf9f4" stroke="#c0652a" stroke-width="1.4"/><circle cx="132.7" cy="533.6" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="123.7" y="524.6" font-size="12" text-anchor="end" fill="#1d1b18">12</text><circle cx="233.1" cy="478.3" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="224.1" y="469.3" font-size="12" text-anchor="end" fill="#1d1b18">45</text><circle cx="375.2" cy="448.8" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="366.2" y="439.8" font-size="12" text-anchor="end" fill="#1d1b18">93</text><circle cx="404.6" cy="448.8" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><circle cx="432.4" cy="351.0" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="423.4" y="342.0" font-size="12" text-anchor="end" fill="#1d1b18">1,024</text><circle cx="508.4" cy="351.0" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><circle cx="576.0" cy="292.3" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="567.0" y="283.3" font-size="12" text-anchor="end" fill="#1d1b18">4,313</text><circle cx="597.1" cy="292.3" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><circle cx="617.6" cy="255.1" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="608.6" y="246.1" font-size="12" text-anchor="end" fill="#1d1b18">10,749</text><circle cx="656.9" cy="152.2" r="5" fill="#8a4b16" stroke="#fbf9f4" stroke-width="1"/><text x="647.9" y="143.2" font-size="12" text-anchor="end" fill="#1d1b18">133,679</text><circle cx="732" cy="78" r="5" fill="#8a4b16"/><text x="744" y="82" font-size="13" fill="#1d1b18">cluster certified finite</text><path d="M726.5 108.5L738.5 108.5L732.5 98Z" fill="#fbf9f4" stroke="#c0652a" stroke-width="1.4"/><text x="744" y="108" font-size="13" fill="#1d1b18">walk escaped the window R</text><text x="744" y="124" font-size="12" fill="#8a8174">(reach is at least R)</text><text x="744" y="162" font-size="13" text-anchor="end" fill="#1d1b18">D2</text><text x="876" y="162" font-size="13" text-anchor="end" fill="#1d1b18">primes in cluster</text><text x="744" y="180" font-size="12" text-anchor="end" fill="#8a8174">2</text><text x="876" y="180" font-size="12" text-anchor="end" fill="#8a8174">100</text><text x="744" y="198" font-size="12" text-anchor="end" fill="#8a8174">4</text><text x="876" y="198" font-size="12" text-anchor="end" fill="#8a8174">720</text><text x="744" y="216" font-size="12" text-anchor="end" fill="#8a8174">8</text><text x="876" y="216" font-size="12" text-anchor="end" fill="#8a8174">2,996</text><text x="744" y="234" font-size="12" text-anchor="end" fill="#8a8174">9</text><text x="876" y="234" font-size="12" text-anchor="end" fill="#8a8174">2,996</text><text x="744" y="252" font-size="12" text-anchor="end" fill="#8a8174">10</text><text x="876" y="252" font-size="12" text-anchor="end" fill="#8a8174">249,508</text><text x="744" y="270" font-size="12" text-anchor="end" fill="#8a8174">13</text><text x="876" y="270" font-size="12" text-anchor="end" fill="#8a8174">249,508</text><text x="744" y="288" font-size="12" text-anchor="end" fill="#8a8174">16</text><text x="876" y="288" font-size="12" text-anchor="end" fill="#8a8174">2,780,476</text><text x="744" y="306" font-size="12" text-anchor="end" fill="#8a8174">17</text><text x="876" y="306" font-size="12" text-anchor="end" fill="#8a8174">2,780,476</text><text x="744" y="324" font-size="12" text-anchor="end" fill="#8a8174">18</text><text x="876" y="324" font-size="12" text-anchor="end" fill="#8a8174">19,087,572</text><text x="744" y="342" font-size="12" text-anchor="end" fill="#8a8174">20</text><text x="876" y="342" font-size="12" text-anchor="end" fill="#8a8174">2,190,320,672</text><text x="726" y="372" font-size="12" fill="#8a8174">Equal clusters: every Gaussian</text><text x="726" y="389" font-size="12" fill="#8a8174">prime but the associates of 1 + i</text><text x="726" y="406" font-size="12" fill="#8a8174">has odd norm, so a + b is odd and</text><text x="726" y="423" font-size="12" fill="#8a8174">a step between two of them has</text><text x="726" y="440" font-size="12" fill="#8a8174">|step|² even. Odd bounds 9, 13, 17</text><text x="726" y="457" font-size="12" fill="#8a8174">add only steps out of ±1 ± i, and</text><text x="726" y="474" font-size="12" fill="#8a8174">those add nothing here.</text><text x="726" y="491" font-size="12" fill="#8a8174"></text><text x="726" y="508" font-size="12" fill="#8a8174">Escaped runs are kept: the √20 walk</text><text x="726" y="525" font-size="12" fill="#8a8174">left every window up to</text><text x="726" y="542" font-size="12" fill="#8a8174">R = 100,000 before one held it.</text></svg>