<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590" viewBox="0 0 1300 590" role="img" aria-labelledby="title desc">
<title id="title">Two arithmetic locks target different failures</title>
<desc id="desc">An 11-point finite-field parabola has 165 distinct-label triples and no zero determinants modulo eleven. A 49-point elliptic quadratic cap over F7 has 18,424 triples and no three affinely collinear, but 2,968 triples have zero linear determinant. A highlighted triple illustrates the distinction. These finite examples do not prove a power improvement in Heilbronn's triangle problem.</desc>
<rect width="1300" height="590" fill="#f4f1e9"/>
<text x="37" y="48" fill="#24434a" font-family="Georgia,serif" font-size="29">Two arithmetic locks target different failures</text>
<text x="38" y="77" fill="#617579" font-family="Arial,sans-serif" font-size="15">Small exact models of the determinant and cap ingredients in family 191 · not the power-bound construction</text>
<rect x="34" y="103" width="533" height="402" rx="12" fill="#fffdf9" stroke="#d7d2c8"/>
<rect x="582" y="103" width="683" height="402" rx="12" fill="#fffdf9" stroke="#d7d2c8"/>
<text x="54" y="142" fill="#24434a" font-family="Georgia,serif" font-size="21">F₁₁ parabola: determinant lock</text>
<text x="54" y="165" fill="#617579" font-family="Arial,sans-serif" font-size="14">(1, t, t²) · distinct labels t</text>
<text x="601" y="142" fill="#24434a" font-family="Georgia,serif" font-size="21">F₇ quadratic cap: line lock</text>
<text x="601" y="165" fill="#617579" font-family="Arial,sans-serif" font-size="14">(x, y, x² − 3y²) · tile color/number = height mod 7</text>
