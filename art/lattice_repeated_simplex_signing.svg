<text x="42" y="51" font-family="Georgia,serif" font-size="29" fill="#173d4a">An optimal sign change cannot survive another round</text>
<text x="44" y="80" font-family="Arial,sans-serif" font-size="15" fill="#547079">Three fixed-order rounds of the same 15 regular-simplex vertices · squared prefix norm</text>
