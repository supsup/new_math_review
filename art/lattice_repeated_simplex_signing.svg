<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="670" viewBox="0 0 1250 670" role="img" aria-labelledby="title desc">
<title id="title">Only the final repeated-simplex round may change sign</title>
<desc id="desc">For three fixed-order rounds of fifteen regular-simplex vertices, a signing with constant first two rounds and a final-sign flip in the last round stays at the optimal squared peak four. If the first round instead flips its final sign, even the best choice of the first seven signs in round two reaches squared norm six, exceeding the optimum.</desc>
