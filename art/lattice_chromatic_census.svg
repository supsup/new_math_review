<title id="title">Exact finite census of chromatic quasisymmetric coefficients</title>
<desc id="desc">All 196 natural unit interval graphs with at most six vertices pass exact finite coefficient checks. The left matrix gives elementary coefficients by q degree for the six-vertex path. The right chart gives the number of six-vertex graphs at each edge count.</desc>
