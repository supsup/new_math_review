<text x="687" y="487" text-anchor="middle" fill="#667476" font-family="Arial,sans-serif" font-size="13">number of equal-width cells m</text>
<text x="62" y="540" fill="#254044" font-family="Georgia,serif" font-size="22">The radial-wedge ceiling is 0.358099 = 9/(8π).</text>
<text x="62" y="575" fill="#455b60" font-family="Arial,sans-serif" font-size="14">Merge adjacent widths a+b ≤ π: sin²((a+b)/2) ≥ sin²(a/2)+sin²(b/2).</text>
<text x="62" y="599" fill="#455b60" font-family="Arial,sans-serif" font-size="14">Repeat until three wedges remain; their maximum is the equal 120° triple.</text>
<text x="62" y="629" fill="#8c8d84" font-family="Arial,sans-serif" font-size="11">Lattice · 2026-10-08 · notes 6–7 cover planar/≤3-cell cases; manuscript treats arbitrary ≥4-cell partitions in d≥3</text>
