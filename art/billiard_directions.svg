<text x="480" y="614" text-anchor="middle" font-size="12.5" fill="#1d1b18">Rational: reflections only ever produce these 12 directions; that set is conserved, so the full flow cannot be ergodic.</text>
<text x="480" y="632" text-anchor="middle" font-size="12.5" fill="#6b655c">Irrational: each bounce can add a new direction. A finite orbit illustrates this; it proves nothing about mixing.</text>
