<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">Why three Gaussian propeller blades?</title>
<desc id="desc">Three equal radial sectors each have an unnormalized Gaussian first-moment vector. Their total squared moment is 9 over 8 pi. A bar chart shows the scores of equal-sector partitions with 2 through 8 cells; three wins within this family. A merge identity proves the stronger radial-wedge statement.</desc>
<rect width="980" height="650" fill="#f5f1e8"/>
<text x="60" y="57" fill="#254044" font-family="Georgia,serif" font-size="35">Why three propeller blades?</text>
<text x="62" y="91" fill="#617478" font-family="Georgia,serif" font-size="17">A complete proof for radial wedges · a bounded slice of family 096</text>
<text x="62" y="125" fill="#994f3e" font-family="Georgia,serif" font-size="18">score = Σ |∫cell x dγ₂|² = Σ sin²(width/2)/(2π)</text>
<rect x="60" y="149" width="381" height="350" rx="13" fill="#fffdf9" stroke="#d6d2c8"/>
<rect x="458" y="149" width="462" height="350" rx="13" fill="#fffdf9" stroke="#d6d2c8"/>
<text x="251" y="184" text-anchor="middle" fill="#254044" font-family="Georgia,serif" font-size="21">three 120° sectors</text>
<text x="689" y="184" text-anchor="middle" fill="#254044" font-family="Georgia,serif" font-size="21">equal m-sector partitions</text>

