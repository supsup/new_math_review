<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="606" viewBox="0 0 1360 606" role="img" aria-labelledby="title desc">
<title id="title">The optimum sees only radius-weighted directions</title>
<desc id="desc">Two planar three-ray probability laws have different direction probabilities and conditional radii, but each ray carries the same expected radial mass one third in both laws. Law B has two radii on each ray. Thus both have three-label first-moment optimum one third. A uniform unit circle has the same mean radius one but a different weighted angular measure and a smaller three-label optimum, nine over four pi squared.</desc>
<rect width="1360" height="606" fill="#f4f1e9"/>
<text x="42" y="54" fill="#24434a" font-family="Georgia,serif" font-size="29">The optimum sees weighted directions</text>
<text x="43" y="83" fill="#617579" font-family="Arial,sans-serif" font-size="15">Two laws share ρ and tie; a unit circle shares only E R = 1 and differs · family 096 · Lattice</text>
<rect x="42" y="114" width="302" height="351" rx="13" fill="#fffdf9" stroke="#d7d2c8"/>
<rect x="361" y="114" width="696" height="351" rx="13" fill="#fffdf9" stroke="#d7d2c8"/>
<rect x="1074" y="114" width="242" height="351" rx="13" fill="#fffdf9" stroke="#d7d2c8"/>
<text x="193" y="155" text-anchor="middle" fill="#24434a" font-family="Georgia,serif" font-size="20">three directions</text>
<line x1="193" y1="299" x2="304.00" y2="299.00" stroke="#779497" stroke-width="2.2"/>
<circle cx="304.00" cy="299.00" r="8" fill="#b96047"/>
<text x="324.00" y="304.00" text-anchor="middle" fill="#24434a" font-family="Arial,sans-serif" font-size="16">u1</text>
<line x1="193" y1="299" x2="137.50" y2="202.87" stroke="#779497" stroke-width="2.2"/>
<circle cx="137.50" cy="202.87" r="8" fill="#b96047"/>
<text x="127.50" y="190.55" text-anchor="middle" fill="#24434a" font-family="Arial,sans-serif" font-size="16">u2</text>
<line x1="193" y1="299" x2="137.50" y2="395.13" stroke="#779497" stroke-width="2.2"/>
<circle cx="137.50" cy="395.13" r="8" fill="#b96047"/>
<text x="127.50" y="417.45" text-anchor="middle" fill="#24434a" font-family="Arial,sans-serif" font-size="16">u3</text>
<circle cx="193" cy="299" r="5" fill="#24434a"/>
<text x="193" y="449" text-anchor="middle" fill="#6a7b7d" font-family="Arial,sans-serif" font-size="13">each pair has dot product −½</text>
<text x="384" y="158" fill="#24434a" font-family="Georgia,serif" font-size="18">ray</text>
<text x="474" y="158" fill="#24434a" font-family="Georgia,serif" font-size="18">law A: p × r</text>
<text x="700" y="158" fill="#24434a" font-family="Georgia,serif" font-size="18">law B: p × E r</text>
<text x="947" y="158" text-anchor="middle" fill="#24434a" font-family="Georgia,serif" font-size="18">ρ(ray)</text>
<line x1="382" y1="246" x2="1033" y2="246" stroke="#e7e9e4" stroke-width="1"/>
<text x="384" y="221" fill="#24434a" font-family="Arial,sans-serif" font-size="19">u1</text>
<text x="477" y="221" fill="#516a6e" font-family="Arial,sans-serif" font-size="19">⅓ × 1</text>
<text x="704" y="221" fill="#516a6e" font-family="Arial,sans-serif" font-size="19">½ × ⅔</text>
<text x="947" y="221" text-anchor="middle" fill="#b35e47" font-family="Arial,sans-serif" font-size="21">⅓</text>
<line x1="382" y1="324" x2="1033" y2="324" stroke="#e7e9e4" stroke-width="1"/>
<text x="384" y="299" fill="#24434a" font-family="Arial,sans-serif" font-size="19">u2</text>
<text x="477" y="299" fill="#516a6e" font-family="Arial,sans-serif" font-size="19">⅓ × 1</text>
<text x="704" y="299" fill="#516a6e" font-family="Arial,sans-serif" font-size="19">⅓ × 1</text>
<text x="947" y="299" text-anchor="middle" fill="#b35e47" font-family="Arial,sans-serif" font-size="21">⅓</text>
<line x1="382" y1="402" x2="1033" y2="402" stroke="#e7e9e4" stroke-width="1"/>
<text x="384" y="377" fill="#24434a" font-family="Arial,sans-serif" font-size="19">u3</text>
<text x="477" y="377" fill="#516a6e" font-family="Arial,sans-serif" font-size="19">⅓ × 1</text>
<text x="704" y="377" fill="#516a6e" font-family="Arial,sans-serif" font-size="19">⅙ × 2</text>
<text x="947" y="377" text-anchor="middle" fill="#b35e47" font-family="Arial,sans-serif" font-size="21">⅓</text>
<text x="385" y="439" fill="#6a7b7d" font-family="Arial,sans-serif" font-size="14">Both have E R = 1; law B uses two radii per ray (mean shown).</text>
<text x="1195" y="155" text-anchor="middle" fill="#24434a" font-family="Georgia,serif" font-size="19">control: unit circle</text>
<circle cx="1195" cy="262" r="69" fill="none" stroke="#b96047" stroke-width="7"/>
<line x1="1195" y1="262" x2="1264" y2="262" stroke="#d6a796" stroke-width="1.5"/>
<line x1="1195" y1="262" x2="1160.5" y2="202.25" stroke="#d6a796" stroke-width="1.5"/>
<line x1="1195" y1="262" x2="1160.5" y2="321.75" stroke="#d6a796" stroke-width="1.5"/>
<circle cx="1195" cy="262" r="4" fill="#24434a"/>
<text x="1195" y="378" text-anchor="middle" fill="#647579" font-family="Arial,sans-serif" font-size="14">E R = 1; different ρ</text>
<text x="1195" y="410" text-anchor="middle" fill="#9f513d" font-family="Arial,sans-serif" font-size="17">3 labels: 9/(4π²)</text>
<text x="1195" y="439" text-anchor="middle" fill="#647579" font-family="Arial,sans-serif" font-size="13">≈ 0.228, not 1/3</text>
<text x="43" y="513" fill="#405960" font-family="Georgia,serif" font-size="20">Same sharp scores: 2 labels → 2/9; 3 or more labels → 1/3.</text>
<text x="43" y="547" fill="#647579" font-family="Arial,sans-serif" font-size="14">The control has the same mean radius, but its radial weight is spread continuously around the circle.</text>
<text x="43" y="579" fill="#8b918a" font-family="Arial,sans-serif" font-size="12">Cone reassignment rules out a better radius-splitting partition; this finite example does not address the all-dimensional Gaussian conjecture.</text>
</svg>
