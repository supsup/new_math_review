<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620" role="img" aria-labelledby="title desc">
<title id="title">Balanced angular blocks solve every regular polygon's three-label score</title>
<desc id="desc">An eleven-point regular polygon is colored into three consecutive blocks of sizes three, four, and four, the exact optimum. At right, the exact three-label score difference from the uniform circle, multiplied by N squared, approaches three quarters when N is divisible by three and five twelfths otherwise.</desc>
