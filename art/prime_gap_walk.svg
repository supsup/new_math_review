c0652a" stroke-width="1.4"/><circle cx="103.6" cy="472.9" r="5" fill="none" stroke="#1d1b18" stroke-width="1"/><text x="117.6" y="462.9" font-size="11.5" fill="#1d1b18">gap 8 after 89</text><circle cx="113.8" cy="468.4" r="5" fill="none" stroke="#1d1b18" stroke-width="1"/><text x="129.8" y="482.4" font-size="11.5" fill="#1d1b18">gap 14 after 113</text><circle cx="147.8" cy="421.7" r="5" fill="none" stroke="#1d1b18" stroke-width="1"/><text x="159.8" y="439.7" font-size="11.5" fill="#1d1b18">gap 34 after 1,327</text><circle cx="280.3" cy="315.0" r="5" fill="none" stroke="#1d1b18" stroke-width="1"/><text x="292.3" y="333.0" font-size="11.5" fill="#1d1b18">gap 112 after 370,261</text><text x="731.0" y="111.3" font-size="11.5" text-anchor="end" fill="#1d1b18">gap 382 after 10,726,904,659</text><line x1="820" x2="846" y1="84" y2="84" stroke="#8a4b16" stroke-width="1.8"/><text x="854" y="88" font-size="13" fill="#1d1b18">p(k), exact</text><text x="854" y="105" font-size="11.5" fill="#8a8174">dots: the 35 record gaps ≥ 2</text><line x1="820" x2="846" y1="128" y2="128" stroke="#8a8174" stroke-dasharray="4 4"/><text x="854" y="132" font-size="13" fill="#1d1b18">p = e<tspan dy="-6" font-size="10">√k</tspan></text><text x="854" y="149" font-size="11.5" fill="#8a8174">Cramér-style guess: a gap g</text><text x="854" y="164" font-size="11.5" fill="#8a8174">first shows up near e<tspan dy="-5" font-size="9">√g</tspan></text><path d="M828 194L833 186L838 194" fill="none" stroke="#c0652a" stroke-width="1.4"/><text x="854" y="194" font-size="13" fill="#1d1b18">k ≥ 382: beyond the sieve</text><text x="854" y="211" font-size="11.5" fill="#8a8174">p(k) &gt; 10,999,999,618</text><text x="820" y="254" font-size="12" fill="#8a8174">sieve: every odd number to 11,000,000,000</text><text x="820" y="272" font-size="12" fill="#8a8174">(PrimeGaps.java, 498,388,617 primes);</text><text x="820" y="290" font-size="12" fill="#8a8174">records below 10,000,000 re-derived in</text><text x="820" y="308" font-size="12" fill="#8a8174">Python; all records match the</text><text x="820" y="326" font-size="12" fill="#8a8174">published maximal-gap table.</text><text x="820" y="344" font-size="12" fill="#8a8174"></text><text x="820" y="362" font-size="12" fill="#8a8174">On the line the walk always stops:</text><text x="820" y="380" font-size="12" fill="#8a8174">n! + 2, n! + 3, ..., n! + n are n − 1</text><text x="820" y="398" font-size="12" fill="#8a8174">composites in a row, so some gap</text><text x="820" y="416" font-size="12" fill="#8a8174">beats every k. In the plane that is</text><text x="820" y="434" font-size="12" fill="#8a8174">the Gaussian moat problem: open</text><text x="820" y="452" font-size="12" fill="#8a8174">since 1962, family 028 claims it.</text></svg>