<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<title id="title">Two orbits, one short cycle</title>
<desc id="description">Exact p=13 shift-pair construction: gold quadratic residues form one six-vertex short orbit under multiplication by four; teal spokes map them to the six nonresidues under multiplication by six. Six paired shift rows partition the twelve nonzero offsets.</desc>
<defs>
  <radialGradient id="bg"><stop offset="0" stop-color="#16263b"/><stop offset="1" stop-color="#08101d"/></radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2c3d"/><stop offset="1" stop-color="#101a2a"/></linearGradient>
  <filter id="goldglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="tealglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
