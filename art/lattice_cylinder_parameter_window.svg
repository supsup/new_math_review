<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620" role="img" aria-labelledby="title desc">
<title id="title">A one-million-cylinder parameter choice</title>
<desc id="desc">The source's sufficient quantitative coverage criterion gives a lower margin curve, and its variable-margin area bound gives a sufficient upper margin curve. Their overlap permits tilt tau one over five hundred and margin eta one over four hundred ninety-eight: exactly one million cylinders with positive coverage budget and strict saving below half the minimum projection area. The preprint's explicit point tau one over two thousand and eta one over one thousand uses sixteen million cylinders. Zero tilt is a limiting, excluded edge.</desc>
<rect width="1260" height="620" fill="#f4f1e9"/>
<text x="38" y="47" fill="#24434a" font-family="Georgia,serif" font-size="28">One million cylinders from the same secant construction</text>
<text x="39" y="78" fill="#617579" font-family="Arial,sans-serif" font-size="15">Two sufficient source inequalities certify a larger tilt with a variable radial margin.</text>
