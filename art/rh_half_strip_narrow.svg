<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 232" role="img" aria-labelledby="title desc">
  <title id="title">Why only the center line remains</title>
  <desc id="desc">A hypothetical zero at one quarter would reflect to three quarters. The theorem rules out the right half. Symmetry rules out the left half, so nontrivial zeros lie on the center line.</desc>
  <rect width="320" height="232" fill="#fbf6eb"/>
  <rect x="38" y="35" width="244" height="128" fill="#f3ded9" stroke="#b58e82"/>
  <path d="M160 29v140" stroke="#21694e" stroke-width="3"/>
  <path d="M99 117h122" stroke="#914436" stroke-width="2" stroke-dasharray="4 4"/>
  <g fill="#fdf9ee" stroke="#963f32" stroke-width="2">
    <circle cx="99" cy="117" r="9"/><circle cx="221" cy="117" r="9"/>
    <path d="m94 112 10 10m0-10-10 10m122-10 10 10m0-10-10 10" fill="none"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#783629">
    <text x="99" y="64">Ruled out</text><text x="99" y="85">by symmetry</text>
    <text x="221" y="64">Ruled out</text><text x="221" y="85">by the theorem</text>
    <text x="99" y="145">Candidate</text><text x="221" y="145">Reflection</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#3e3529">
    <text x="38" y="187">0</text><text x="99" y="187">¼</text><text x="160" y="187" fill="#21694e" font-weight="700">½</text><text x="221" y="187">¾</text><text x="282" y="187">1</text>
    <text x="160" y="213">Real part</text>
  </g>
</svg>
