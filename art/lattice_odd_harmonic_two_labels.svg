<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" role="img" aria-labelledby="title desc">
<title id="title">Two labels cannot see this threefold angular ripple</title>
<desc id="desc">The uniform unit circle and a unit-circle law with angular density one plus cosine of three theta have the same mean zero and the same absolute projection in every direction. Their sharp two-label first-moment scores both equal two over pi squared. Three equal 120-degree sectors attain the sharp three-label scores, nine over four pi squared for the uniform law and 729 over 256 pi squared for the three-lobed law. The rosettes depict angular density, not support radius.</desc>
<rect width="1240" height="610" fill="#f4f1e9"/>
<text x="38" y="47" fill="#24434a" font-family="Georgia,serif" font-size="28">Two labels miss a threefold angular ripple</text>
<text x="39" y="77" fill="#617579" font-family="Arial,sans-serif" font-size="15">Same mean and every absolute projection · a third label reveals a difference</text>
<rect x="37" y="103" width="566" height="428" rx="12" fill="#fffdf9" stroke="#d7d2c8"/>
<rect x="619" y="103" width="584" height="428" rx="12" fill="#fffdf9" stroke="#d7d2c8"/>
<text x="59" y="143" fill="#24434a" font-family="Georgia,serif" font-size="21">uniform directions</text>
<text x="642" y="143" fill="#24434a" font-family="Georgia,serif" font-size="21">density 1 + cos(3θ)</text>
<text x="59" y="167" fill="#647579" font-family="Arial,sans-serif" font-size="14">one unit of radial weight, spread evenly</text>
<text x="642" y="167" fill="#647579" font-family="Arial,sans-serif" font-size="14">one unit of radial weight, shifted among directions</text>
