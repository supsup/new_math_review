<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
<title id="title">A scaled Gaussian energy gap reflected through alpha equals pi</title>
<desc id="desc">The scaled square-minus-triangle energy gap has exact reflection symmetry in log alpha. Two sample pairs are connected; the low pair has a raised bracket for visibility. Small square and triangular lattices have equal area cells.</desc>
<rect width="1040" height="690" fill="#f5f1e8"/>
<text x="64" y="57" fill="#254044" font-family="Georgia,serif" font-size="34">The scaled lattice gap has a mirror</text>
<text x="66" y="91" fill="#627477" font-family="Georgia,serif" font-size="17">Square minus triangular Gaussian energy · equal-area cells · family 090</text>
<text x="66" y="124" fill="#944e3c" font-family="Georgia,serif" font-size="18">F(α) = √(α/π) [E_sq(α) − E_tri(α)] = F(π²/α)</text>
