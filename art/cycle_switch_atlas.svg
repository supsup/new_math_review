<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760"
 viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
<title id="title">Two cycle switches through the order-31 Steiner-system frontier</title>
<desc id="description">A ranked path from the root-eight one-Pasch design to the
root-six one-Pasch design via a six-block switch, then to a noncyclic
anti-Pasch design via a ten-block switch. The best cyclic anti-Pasch
design ranks above them but is connected by a rank-only dotted line.
Switch counts are exhaustive only for the specified point-pair cycle move.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#081321"/><stop offset="1" stop-color="#152343"/>
 </linearGradient>
 <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
  <stop stop-color="#6bd3fa"/><stop offset="1" stop-color="#9ff5d0"/>
 </linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6"
  orient="auto" markerUnits="userSpaceOnUse">
  <path d="M1 1 L10 6 L1 11" fill="none" stroke="#a2ecdf" stroke-width="2.4"/>
 </marker>
 <style>
  text { font-family: Avenir Next, Inter, Helvetica Neue, Arial, sans-serif; }
  .card { fill:#132c43; stroke:#60aabf; stroke-width:1.5; }
  .faint { stroke:#7190b2; opacity:.12; }
  .small { letter-spacing:1.8px; }
 </style>
</defs>
<rect width="1280" height="760" fill="url(#background)"/>
<g class="faint" fill="none">
