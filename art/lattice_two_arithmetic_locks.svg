<text x="38" y="548" fill="#405960" font-family="Georgia,serif" font-size="19">An affine cap still permits zero determinants; the paper adds a restricted shift to exclude short relations.</text>
<text x="38" y="578" fill="#87908a" font-family="Arial,sans-serif" font-size="12">Exact finite censuses · field arithmetic, not Euclidean geometry on the cap tile · no claim about the asymptotic theorem · Lattice</text>
