<svg xmlns="http://www.w3.org/2000/svg" width="890" height="550" viewBox="0 0 890 550" role="img" aria-labelledby="title desc">
<title id="title">The shape path from triangular to square</title>
<desc id="desc">Normalized Gaussian energy profiles from 60 to 90 degrees at alpha 1, 2, pi and 30. The first three nearly overlap while alpha 30 visibly departs. Dual scales have exactly matching normalized profiles.</desc>
<rect width="890" height="550" fill="#f5f1e8"/>
<text x="56" y="54" fill="#254044" font-family="Georgia,serif" font-size="31">One area, many angles</text>
<text x="57" y="85" fill="#65767a" font-family="Georgia,serif" font-size="16">A rhombic path from triangular (60°) to square (90°)</text>
<text x="57" y="115" fill="#944e3c" font-family="Georgia,serif" font-size="16">(Eθ − E60°) / (E90° − E60°) · Gaussian scales α = 1, 2, π, 30</text>
<rect x="56" y="139" width="776" height="306" rx="12" fill="#fffdf9" stroke="#d6d2c8"/>

